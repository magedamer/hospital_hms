<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shifa Hospital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: dark petrol rail on the inline-start edge, light work surface, role colour re-tints the whole device.
   Signature element: the thermal receipt slip, drawn at true 80/58mm proportions. */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface2:#F6F9F9; --ink:#10262B; --muted:#5A7075; --line:#D9E3E5;
  --side:#0B2A2F; --side-ink:#CFE3E5; --side-mute:#7FA0A5;
  --role:#0F6670; --role-soft:#DDF0F1; --ok:#1B8A57; --ok-soft:#DDF3E8; --warn:#B87A0B; --warn-soft:#FBEFD2; --bad:#C93B52; --bad-soft:#FBE1E5;
  --paper:#FFFDF8; --paper-ink:#141414; --shadow:0 1px 2px rgba(16,38,43,.06),0 8px 24px rgba(16,38,43,.06);
  --f:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081315; --surface:#0F1F22; --surface2:#132628; --ink:#E4F0F1; --muted:#8FA9AD; --line:#1F3538;
  --side:#06191C; --side-ink:#CFE3E5; --side-mute:#6F9196; --role-soft:#10353A; --ok-soft:#10301F; --warn-soft:#33270A; --bad-soft:#3A1219; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081315; --surface:#0F1F22; --surface2:#132628; --ink:#E4F0F1; --muted:#8FA9AD; --line:#1F3538;
  --side:#06191C; --side-ink:#CFE3E5; --side-mute:#6F9196; --role-soft:#10353A; --ok-soft:#10301F; --warn-soft:#33270A; --bad-soft:#3A1219; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--role);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.94em}
.ic{flex:none}
#app[data-role="reception"]{--role:#0F6670;--role-soft:#DDF0F1}
#app[data-role="lab"]{--role:#5846B8;--role-soft:#E6E2F8}
#app[data-role="pharmacy"]{--role:#2B8A4B;--role-soft:#DDF2E3}
#app[data-role="admin"]{--role:#A9641A;--role-soft:#F7E8D3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #app[data-role="lab"]{--role:#9C8CF0;--role-soft:#241F4A}
:root:not([data-theme="light"]) #app[data-role="pharmacy"]{--role:#5CC47E;--role-soft:#143522}
:root:not([data-theme="light"]) #app[data-role="admin"]{--role:#E0A053;--role-soft:#3A2810}
:root:not([data-theme="light"]) #app[data-role="reception"]{--role:#4FC1CC;--role-soft:#0F3A3F}}
:root[data-theme="dark"] #app[data-role="lab"]{--role:#9C8CF0;--role-soft:#241F4A}
:root[data-theme="dark"] #app[data-role="pharmacy"]{--role:#5CC47E;--role-soft:#143522}
:root[data-theme="dark"] #app[data-role="admin"]{--role:#E0A053;--role-soft:#3A2810}
:root[data-theme="dark"] #app[data-role="reception"]{--role:#4FC1CC;--role-soft:#0F3A3F}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font-weight:700;font-size:18px;color:#fff}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--role);display:grid;place-items:center;color:#fff;font-style:normal}
.dev{margin:0 8px 14px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;color:var(--side-mute)}
.dev b{display:block;color:#fff;font-size:14px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:start;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--role);color:#fff}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.side .foot button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-mute);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:start}
.side .foot button:hover{background:rgba(255,255,255,.07);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700;margin-inline-end:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--role-soft);color:var(--role);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.content{padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px}
.msg{color:var(--muted);margin:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--role)}
.btn.pri{background:var(--role);border-color:var(--role);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 18px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{width:30px;height:30px;padding:0;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.inp,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.inp:focus{border-color:var(--role);outline:2px solid var(--role-soft)}
.search{position:relative}
.search .ic{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-inline-start:36px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--role);color:#fff}

/* panels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.card>header .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.card .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.cols{display:grid;gap:18px;align-items:start}
.c3{grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr) minmax(300px,.95fr)}
.c2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.c2b{grid-template-columns:minmax(300px,.8fr) minmax(0,1.4fr)}
.sumline{display:flex;gap:28px;flex-wrap:wrap;padding:2px 2px 0}
.sumline div{display:flex;flex-direction:column}
.sumline b{font-size:24px;font-weight:700;line-height:1.2}
.sumline span{color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end}
tr.sel td{background:var(--role-soft)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface2)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface2)}
.item.sel{background:var(--role-soft)}
.item .meta{color:var(--muted);font-size:12.5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--role-soft);color:var(--role);display:grid;place-items:center;font-weight:700;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tile:hover{border-color:var(--role)}
.tile[aria-pressed="true"]{border-color:var(--role);background:var(--role-soft);outline:1px solid var(--role)}
.tile b{font-weight:600}.tile small{color:var(--muted);font-size:12px}
.svc{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:start;width:100%}
.svc:hover{border-color:var(--role)}
.svc .p{margin-inline-start:auto;font-weight:600}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center}
.bar .t{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--role);border-radius:6px}
.fl{font-weight:700;padding:1px 7px;border-radius:6px;font-size:12px}
.fl.H,.fl.A{background:var(--bad-soft);color:var(--bad)}.fl.L{background:var(--warn-soft);color:var(--warn)}.fl.N{background:var(--ok-soft);color:var(--ok)}
.mat td,.mat th{text-align:center}.mat td:first-child,.mat th:first-child{text-align:start}
.chk{width:18px;height:18px;accent-color:var(--role)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink)}

/* thermal slip */
.slips{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.slip{background:var(--paper);color:var(--paper-ink);width:290px;max-width:100%;padding:16px 16px 26px;font-size:12.5px;line-height:1.5;box-shadow:0 2px 10px rgba(0,0,0,.18);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.slip.w58{width:224px}
.slip .h{text-align:center;font-size:11px;letter-spacing:.02em;color:#555}
.slip .big{text-align:center;font-size:21px;font-weight:700;line-height:1.25;margin:6px 0 2px}
.slip .sub{text-align:center;font-size:12px;color:#444}
.slip hr{border:0;border-top:1.5px dashed #888;margin:9px 0}
.slip .m{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px}
.slip .r{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.slip .tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.slip .ft{text-align:center;color:#555;font-size:11px;margin-top:8px}
.paper{background:var(--paper);color:var(--paper-ink);padding:28px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.2);width:min(640px,100%)}
.paper h2{margin:0;font-size:20px}.paper table td,.paper table th{color:var(--paper-ink);border-color:#d8d4c8;padding:7px 8px}.paper th{color:#555}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(5,16,18,.62);display:grid;place-items:start center;padding:32px 16px;overflow:auto;z-index:50}
.modal{width:min(900px,100%);background:var(--surface);border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:0}
.modal>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.modal .mb{padding:22px 18px;display:flex;flex-direction:column;gap:18px;align-items:center;background:var(--surface2);border-radius:0 0 16px 16px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60}
.toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:28px;padding:48px max(16px,env(safe-area-inset-left,0px)) 40px;background:
  radial-gradient(1200px 500px at 50% -10%,var(--role-soft),transparent 70%),var(--bg)}
.login .logo{display:flex;align-items:center;gap:14px;font-size:38px;font-weight:700}
.login .logo i{width:56px;height:56px;border-radius:16px;background:#0F6670;color:#fff;display:grid;place-items:center;font-style:normal}
.devs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;width:min(1080px,100%)}
.devc{--c:var(--role);text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.devc:hover{border-color:var(--c);transform:translateY(-2px)}
.devc .top2{display:flex;justify-content:space-between;align-items:center}
.devc .ico{width:46px;height:46px;border-radius:13px;background:var(--c);color:#fff;display:grid;place-items:center}
.devc h3{margin:0;font-size:19px}.devc p{margin:0;color:var(--muted);font-size:13px}
.devc .who{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.tools{display:flex;gap:8px}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}
  .brand{padding:0 6px 0 0}.dev{display:none}.nav{flex-direction:row;flex-wrap:wrap}.side .foot{margin:0;flex-direction:row}
  .c3,.c2,.c2b{grid-template-columns:minmax(0,1fr)}
  .top,.content{padding-inline:16px}
  .bar{grid-template-columns:84px minmax(0,1fr) 78px}
}
@media (prefers-reduced-motion:no-preference){.devc{transition:transform .15s,border-color .15s}}
</style>
<div id="app"></div>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ICONS={
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .6 3.5 2.2 3.5 5.2"/>',
 flask:'<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7.5 15h9"/>',
 pill:'<path d="M10.5 20.5a5 5 0 0 1-7-7l10-10a5 5 0 0 1 7 7z"/><path d="m8.5 8.5 7 7"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
 clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2.5l2.3 11h10.2L20 8H7"/>',
 box:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
 truck:'<path d="M2 6h11v10H2zM13 9h4l4 4v3h-8"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',
 gear:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/>',
 check:'<path d="m5 12 5 5 9-10"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 printer:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/>',
 logout:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',
 tooth:'<path d="M7 3c-3 0-4 3-3.5 6 .5 3 1.5 4 2 8 .3 2.500 1.700 4 2.500 2.500.8-1.500.7-4 3-4s2.200 2.500 3 4c.8 1.500 2.200 0 2.500-2.500.5-4 1.500-5 2-8C21 6 20 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/>'
};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- master data ---------- */
const CUR={SDG:['ج.س','SDG'],EGP:['ج.م','EGP'],SAR:['ر.س','SAR']};
const DEPTS={
 general:{ar:'عمومي',en:'General',receipt:'dept',duty:false},
 specialist:{ar:'أخصائي',en:'Specialist',receipt:'doctor',duty:true},
 internal:{ar:'استشارة باطنية',en:'Internal medicine',receipt:'doctor',duty:true},
 icu:{ar:'الإنعاش',en:'ICU / Emergency',receipt:'dept',duty:true},
 minor:{ar:'العمليات الصغيرة',en:'Minor procedures',receipt:'dept',duty:true},
 dental:{ar:'عيادة الأسنان',en:'Dental clinic',receipt:'doctor',duty:true}
};

function createVisit(pid,refs,method,time,silent){
 const lines=[];const v={id:uid(),no:++S.vno,pid,lines,method,time,shift:S.shiftNo};
 refs.forEach(r=>{
  if(r.k==='s'){const s=svcOf(r.id);lines.push({kind:'svc',id:s.id,dept:s.dept,ar:s.ar,en:s.en,price:s.price,pct:s.pct,staff:DEPTS[s.dept].duty?S.roster[s.dept]:null})}
  else{const t=testOf(r.id);lines.push({kind:'lab',id:t.id,dept:'lab',ar:t.ar,en:t.en,price:testPrice(t.id),pct:0,staff:null});
   S.orders.push({id:uid(),vid:v.id,pid,testId:t.id,status:'pending',results:{},time})}
 });
 v.total=lines.reduce((a,l)=>a+l.price,0);S.visits.push(v);return v;
}
function shiftStats(no){
 const vs=S.visits.filter(v=>v.shift===no),ps=S.sales.filter(s=>s.shift===no);
 const byDept={},byStaff={};let cash=0,card=0;
 vs.forEach(v=>{(v.method==='cash'?cash+=v.total:card+=v.total);v.lines.forEach(l=>{byDept[l.dept]=(byDept[l.dept]||0)+l.price;
  if(l.staff&&l.pct>0){const b=byStaff[l.staff]||(byStaff[l.staff]={base:0,comm:0,n:0});b.base+=l.price;b.comm+=l.price*l.pct/100;b.n++}})});
 ps.forEach(s=>{(s.method==='cash'?cash+=s.total:card+=s.total);byDept.pharmacy=(byDept.pharmacy||0)+s.total});
 const total=cash+card,comm=Object.values(byStaff).reduce((a,b)=>a+b.comm,0);
 return{vs,ps,byDept,byStaff,cash,card,total,comm,net:total-comm,count:vs.length+ps.length};
}
function flagOf(p,val){
 if(val===''||val==null)return'';
 if(p.opts)return p.nl.includes(val)?'N':'A';
 const n=parseFloat(val);if(isNaN(n))return'';return n<p.lo?'L':n>p.hi?'H':'N';
}

/* ---------- render ---------- */
const VIEWS={visit:vVisit,queue:vQueue,shift:vShift,orders:vOrders,catalog:vCatalog,pos:vPos,stock:vStock,purchases:vPurchases,sales:vSales,dash:vDash,roster:vRoster,settle:vSettle,services:vServices,users:vUsers,reports:vReports,settings:vSettings};
function applyLang(){const h=document.documentElement;h.lang=S.lang;h.dir=S.lang==='ar'?'rtl':'ltr';if(S.theme==='auto')h.removeAttribute('data-theme');else h.setAttribute('data-theme',S.theme)}
function render(){
 applyLang();
 const ae=document.activeElement;const aid=ae&&ae.id;const sel=ae&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;const sc=$('.main')?$('.main').scrollTop:0,wsc=window.scrollY;
 const app=$('#app');
 if(!U.role){app.removeAttribute('data-role');app.innerHTML=renderLogin()}
 else{app.setAttribute('data-role',U.role);if(!VIEWS[U.view]||!NAV[U.role].some(n=>n[0]===U.view&&can(n[3]))){const f=NAV[U.role].find(n=>can(n[3]));U.view=f?f[0]:null}
  app.innerHTML=U.view?shell(VIEWS[U.view]()+modal()):shell(`<div class="empty">${x('لا توجد صلاحيات لهذا الجهاز.','No permissions on this device.')}</div>`)}
 if(aid){const n=document.getElementById(aid);if(n){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(sel[0],sel[1])}catch(e){}}}
 window.scrollTo(0,wsc);
}
let tt;function toast(m){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>`;clearTimeout(tt);tt=setTimeout(()=>t.innerHTML='',2600)}
function enter(role){U.role=role;U.view=NAV[role].find(n=>can(n[3]))?.[0];U.modal=null;U.done=null;U.confirmClose=false;if(role==='reception')resetDraft()}
function resetDraft(){U.draft={pid:null,lines:[],method:'cash'};U.newp=false;U.np={name:'',phone:'',age:''};U.pq='';U.done=null}
function setPath(o,path,val){const ks=path.split('.');let r=o;ks.slice(0,-1).forEach(k=>r=r[k]);r[ks.at(-1)]=val}

/* ---------- events ---------- */
const A={
 login:a=>{enter(a.dataset.role);render()},
 logout:()=>{U.role=null;U.modal=null;render()},
 lang:()=>{S.lang=S.lang==='ar'?'en':'ar';save();render()},
 theme:()=>{S.theme=S.theme==='auto'?'dark':S.theme==='dark'?'light':'auto';save();render();toast(S.theme==='auto'?x('المظهر: تلقائي','Theme: auto'):S.theme==='dark'?x('المظهر: داكن','Theme: dark'):x('المظهر: فاتح','Theme: light'))},
 nav:a=>{U.view=a.dataset.v;U.modal=null;U.confirmClose=false;render()},
 printdemo:()=>toast(x('الطباعة الفعلية تعمل من نسخة Laravel عبر ESC/POS','Real printing runs from the Laravel build via ESC/POS')),
 closemodal:(a,e)=>{if(a.dataset.bg&&e.target!==a)return;U.modal=null;render()},
 /* reception */
 selpat:a=>{U.draft.pid=a.dataset.id;render()},clearpat:()=>{U.draft.pid=null;render()},
 newpat:()=>{U.newp=!U.newp;render()},
 savepat:()=>{const n=U.np;if(!n.name.trim()||!n.phone.trim())return toast(x('اكتب الاسم والهاتف','Enter name and phone'));
  const p={id:'P-'+String(S.patients.length+1).padStart(4,'0'),name:n.name.trim(),phone:n.phone.trim(),age:+n.age||0,g:'m'};S.patients.push(p);U.draft.pid=p.id;U.newp=false;U.np={name:'',phone:'',age:''};log('تسجيل مريض '+p.name,'Registered patient '+p.name);save();render()},
 dept:a=>{U.pdept=a.dataset.d;render()},
 addsvc:a=>{U.draft.lines.push({k:'s',id:a.dataset.id});render()},
 addtest:a=>{if(U.draft.lines.some(l=>l.k==='t'&&l.id===a.dataset.id))return toast(x('الفحص مضاف بالفعل','Test already added'));U.draft.lines.push({k:'t',id:a.dataset.id});render()},
 rmline:a=>{U.draft.lines.splice(+a.dataset.i,1);render()},
 method:a=>{U.draft.method=a.dataset.m;render()},
 confirmvisit:()=>{const D=U.draft;if(!D.pid||!D.lines.length)return;const v=createVisit(D.pid,D.lines,D.method,Date.now());log(`زيارة ${v.no} — ${patOf(D.pid).name}`,`Visit ${v.no} — ${patOf(D.pid).name}`);save();U.done=v.id;render()},
 newvisit:()=>{resetDraft();render()},
 slips:a=>{U.modal={t:'slips',id:a.dataset.id};render()},
 qall:a=>{U.qAll=a.dataset.v==='1';render()},
 closeask:a=>{U.confirmClose=a.dataset.v==='1';render()},
 closeshift:()=>{const st=shiftStats(S.shiftNo);S.shifts.push({no:S.shiftNo,closed:Date.now(),total:st.total,comm:st.comm,byStaff:st.byStaff,byDept:st.byDept});log(`إغلاق الوردية ${S.shiftNo}`,`Closed shift ${S.shiftNo}`);S.shiftNo++;U.confirmClose=false;save();render();toast(x('أُغلقت الوردية وبدأت وردية جديدة','Shift closed, new shift started'))},
 settleview:a=>{U.modal={t:'settle',no:+a.dataset.id};render()},
 /* lab */
 tab:a=>{U.tab=a.dataset.t;U.labSel=null;render()},
 labsel:a=>{U.labSel=a.dataset.id;render()},
 labsave:()=>{const o=S.orders.find(o=>o.id===U.labSel);const t=testOf(o.testId);if(t.p.some(p=>(o.results[p.k]??'')===''))return toast(x('أكمل كل البنود قبل الحفظ','Fill every parameter before saving'));o.status='done';o.doneAt=Date.now();log(`نتيجة جاهزة: ${nm(t)}`,`Result ready: ${nm(t)}`);save();render();toast(x('حُفظت النتيجة','Result saved'))},
 labreport:()=>{U.modal={t:'report',id:U.labSel};render()},
 labdeliver:()=>{const o=S.orders.find(o=>o.id===U.labSel);o.status='delivered';log('تسليم نتيجة','Result delivered');save();U.labSel=null;render();toast(x('سُلّمت النتيجة للمريض','Result delivered'))},
 /* pharmacy */
 addcart:a=>{const m=medOf(a.dataset.id);const c=U.cart.find(c=>c.id===m.id);if(c){if(c.qty<m.stock)c.qty++}else U.cart.push({id:m.id,qty:1});render()},
 cartq:a=>{const c=U.cart.find(c=>c.id===a.dataset.id);c.qty+=+a.dataset.d;if(c.qty<=0)U.cart=U.cart.filter(x=>x!==c);else if(c.qty>medOf(c.id).stock)c.qty=medOf(c.id).stock;render()},
 pm:a=>{U.pm=a.dataset.m;render()},
 checkout:()=>{if(!U.cart.length)return;const disc=Math.min(100,Math.max(0,+U.disc||0));const lines=U.cart.map(c=>{const m=medOf(c.id);m.stock-=c.qty;return{medId:c.id,qty:c.qty,price:m.price}});
  const s={id:uid(),no:++S.pno,lines,disc,method:U.pm||'cash',time:Date.now(),shift:S.shiftNo,total:lines.reduce((a,l)=>a+l.qty*l.price,0)*(1-disc/100)};S.sales.push(s);log(`بيع PH-${s.no}`,`Sale PH-${s.no}`);U.cart=[];U.disc='';save();U.modal={t:'sale',id:s.id};render()},
 saleslip:a=>{U.modal={t:'sale',id:a.dataset.id};render()},
 stockf:a=>{U.stockf=a.dataset.f;render()},
 addpl:()=>{const d=U.pur.d;if(!(+d.qty>0)||!(+d.cost>0)||!d.exp)return toast(x('اكتب الكمية والسعر وتاريخ الانتهاء','Enter quantity, cost and expiry'));U.pur.lines.push({med:d.med,qty:+d.qty,cost:+d.cost,batch:d.batch,exp:d.exp});U.pur.d={med:d.med,qty:'',cost:'',batch:'',exp:''};render()},
 rmpl:a=>{U.pur.lines.splice(+a.dataset.i,1);render()},
 savepur:()=>{const P=U.pur;const p={id:uid(),no:S.purchases.length+301,sup:P.sup,lines:P.lines,time:Date.now(),total:P.lines.reduce((a,l)=>a+l.qty*l.cost,0)};
  P.lines.forEach(l=>{const m=medOf(l.med);m.stock+=l.qty;m.cost=l.cost;m.batch=l.batch||m.batch;m.exp=l.exp});S.purchases.push(p);log(`فاتورة شراء PO-${p.no}`,`Purchase PO-${p.no}`);U.pur=null;save();render();toast(x('أُضيفت الكميات للمخزون','Stock updated'))},
 rw:a=>{S.rw=+a.dataset.w;save();render()},
 reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}seed();U.cart=[];U.pur=null;save();render();toast(x('أُعيدت البيانات التجريبية','Demo data restored'))}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=A[a.dataset.act];if(f)f(a,e)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.inp;if(!k)return;
 if(k==='res'){const o=S.orders.find(o=>o.id===U.labSel);o.results[t.dataset.k]=t.value;save();render();return}
 if(k.startsWith('np.'))U.np[k.slice(3)]=t.value;else if(k.startsWith('pd.'))U.pur.d[k.slice(3)]=t.value;else U[k]=t.value;render()});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.chg;if(!k)return;
 if(k==='res'){S.orders.find(o=>o.id===U.labSel).results[t.dataset.k]=t.value}
 else if(k==='roster'){S.roster[t.dataset.d]=t.value;log('تغيير النوبتجية','Duty roster changed')}
 else if(k==='svcp')svcOf(t.dataset.id).price=Math.max(0,+t.value||0);
 else if(k==='svcc')svcOf(t.dataset.id).pct=Math.min(100,Math.max(0,+t.value||0));
 else if(k==='testp')S.tests.find(x=>x.id===t.dataset.id).price=Math.max(0,+t.value||0);
 else if(k==='perm'){const l=S.perms[t.dataset.r];const i=l.indexOf(t.dataset.k);if(t.checked&&i<0)l.push(t.dataset.k);if(!t.checked&&i>=0)l.splice(i,1)}
 else if(k==='hn')S.hospital[t.dataset.l]=t.value||S.hospital[t.dataset.l];
 else if(k==='cur')S.cur=t.value;
 else if(k==='psup')U.pur.sup=t.value;
 else if(k==='pd.med')U.pur.d.med=t.value;
 save();render()});
S=load();if(!S)seed();
render();
</script>

</body></html>
