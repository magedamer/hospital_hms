<style>

  --side:#06191C; --side-ink:#CFE3E5; --side-mute:#6F9196; --role-soft:#10353A; --ok-soft:#10301F; --warn-soft:#33270A; --bad-soft:#3A1219; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--role);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.94em}
.ic{flex:none}
#app[data-role="reception"]{--role:#0F6670;--role-soft:#DDF0F1}

#app[data-role="admin"]{--role:#A9641A;--role-soft:#F7E8D3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #app[data-role="lab"]{--role:#9C8CF0;--role-soft:#241F4A}
:root:not([data-theme="light"]) #app[data-role="pharmacy"]{--role:#5CC47E;--role-soft:#143522}
:root:not([data-theme="light"]) #app[data-role="admin"]{--role:#E0A053;--role-soft:#3A2810}
:root:not([data-theme="light"]) #app[data-role="reception"]{--role:#4FC1CC;--role-soft:#0F3A3F}
}
:root[data-theme="dark"] #app[data-role="lab"]{--role:#9C8CF0;--role-soft:#241F4A}
:root[data-theme="dark"] #app[data-role="pharmacy"]{--role:#5CC47E;--role-soft:#143522}
:root[data-theme="dark"] #app[data-role="admin"]{--role:#E0A053;--role-soft:#3A2810}
:root[data-theme="dark"] #app[data-role="reception"]{--role:#4FC1CC;--role-soft:#0F3A3F}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font-weight:700;font-size:18px;color:#fff}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--role);display:grid;place-items:center;color:#fff;font-style:normal}
.dev{margin:0 8px 14px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;color:var(--side-mute)}
.dev b{display:block;color:#fff;font-size:14px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-ink);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:start;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--role);color:#fff}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.side .foot button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-mute);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:start}
.side .foot button:hover{background:rgba(255,255,255,.07);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;font-weight:700;margin-inline-end:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--role-soft);color:var(--role);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.content{padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px}
.msg{color:var(--muted);margin:0}
.notif-btn{position:relative}
.notif-badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:99px;min-width:16px;text-align:center}
.notif-panel{position:fixed;top:60px;inset-inline-end:16px;width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:40}
.notif-panel header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.notif-panel .n-item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.notif-panel .n-item:hover{background:var(--surface2)}
.notif-panel .n-item.unread{background:var(--role-soft)}
.notif-panel .n-item .t{font-size:11px;color:var(--muted);margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--role)}
.btn.pri{background:var(--role);border-color:var(--role);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:12px 18px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{width:30px;height:30px;padding:0;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0;font-family:inherit}
.inp:focus{border-color:var(--role);outline:2px solid var(--role-soft)}
textarea.inp{resize:vertical;min-height:60px}
.search{position:relative}
.search .ic{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-inline-start:36px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--role);color:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.card>header .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.card .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.cols{display:grid;gap:18px;align-items:start}
.c3{grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr) minmax(300px,.95fr)}
.c2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.c2b{grid-template-columns:minmax(300px,.8fr) minmax(0,1.4fr)}
.sumline{display:flex;gap:28px;flex-wrap:wrap;padding:2px 2px 0}
.sumline div{display:flex;flex-direction:column}
.sumline b{font-size:24px;font-weight:700;line-height:1.2}
.sumline span{color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end}
tr.sel td{background:var(--role-soft)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface2)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface2)}
.item.sel{background:var(--role-soft)}
.item .meta{color:var(--muted);font-size:12.5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--role-soft);color:var(--role);display:grid;place-items:center;font-weight:700;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tile:hover{border-color:var(--role)}
.tile[aria-pressed="true"]{border-color:var(--role);background:var(--role-soft);outline:1px solid var(--role)}
.tile b{font-weight:600}.tile small{color:var(--muted);font-size:12px}
.svc{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:start;width:100%}
.svc:hover{border-color:var(--role)}
.svc .p{margin-inline-start:auto;font-weight:600}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 100px;gap:10px;align-items:center}
.bar .t{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--role);border-radius:6px}
.fl{font-weight:700;padding:1px 7px;border-radius:6px;font-size:12px}
.fl.H,.fl.A{background:var(--bad-soft);color:var(--bad)}.fl.L{background:var(--warn-soft);color:var(--warn)}.fl.N{background:var(--ok-soft);color:var(--ok)}
.mat td,.mat th{text-align:center}.mat td:first-child,.mat th:first-child{text-align:start}
.chk{width:18px;height:18px;accent-color:var(--role)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:500}
.alert.ok{background:var(--ok-soft);color:var(--ok)}

.slips{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.slip{background:var(--paper);color:var(--paper-ink);width:290px;max-width:100%;padding:16px 16px 26px;font-size:12.5px;line-height:1.5;box-shadow:0 2px 10px rgba(0,0,0,.18);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.slip.w58{width:224px}
.slip .h{text-align:center;font-size:11px;letter-spacing:.02em;color:#555}
.slip .big{text-align:center;font-size:21px;font-weight:700;line-height:1.25;margin:6px 0 2px}
.slip .sub{text-align:center;font-size:12px;color:#444}
.slip hr{border:0;border-top:1.5px dashed #888;margin:9px 0}
.slip .m{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px}
.slip .r{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.slip .tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.slip .ft{text-align:center;color:#555;font-size:11px;margin-top:8px}
.paper{background:var(--paper);color:var(--paper-ink);padding:28px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.2);width:min(700px,100%)}
.paper h2{margin:0;font-size:20px}.paper table td,.paper table th{color:var(--paper-ink);border-color:#d8d4c8;padding:7px 8px}.paper th{color:#555}

.ov{position:fixed;inset:0;background:rgba(5,16,18,.62);display:grid;place-items:start center;padding:32px 16px;overflow:auto;z-index:50}
.modal{width:min(900px,100%);background:var(--surface);border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:0}
.modal.wide{width:min(1100px,100%)}
.modal>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.modal .mb{padding:22px 18px;display:flex;flex-direction:column;gap:18px;align-items:center;background:var(--surface2);border-radius:0 0 16px 16px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60}
.toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}

.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:28px;padding:48px max(16px,env(safe-area-inset-left,0px)) 40px;background:radial-gradient(1200px 500px at 50% -10%,var(--role-soft),transparent 70%),var(--bg)}
.login .logo{display:flex;align-items:center;gap:14px;font-size:38px;font-weight:700}
.login .logo i{width:56px;height:56px;border-radius:16px;background:#0F6670;color:#fff;display:grid;place-items:center;font-style:normal}
.tools{display:flex;gap:8px}
.vital-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:26px;font-weight:700}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.good{border-color:var(--ok);background:var(--ok-soft)}
.kpi.warn{border-color:var(--warn);background:var(--warn-soft)}
.kpi.bad{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}
  .brand{padding:0 6px 0 0}.dev{display:none}.nav{flex-direction:row;flex-wrap:wrap}.side .foot{margin:0;flex-direction:row}
  .c3,.c2,.c2b{grid-template-columns:minmax(0,1fr)}
  .top,.content{padding-inline:16px}
  .bar{grid-template-columns:84px minmax(0,1fr) 78px}
}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:transform .15s,border-color .15s,background .15s}}
@media print{
  .side,.top,.toast,.ov>.modal>header,.btn,.tools,.foot,.nav,.notif-panel{display:none!important}
  .ov{position:static;background:none;padding:0}
  .modal{border:0;box-shadow:none}
  .mb{background:none!important;padding:0!important}
  .slip,.paper{box-shadow:none}
  .slip{-webkit-mask:none;mask:none}
  body{background:#fff}
}
</style>

function checkCriticalValues(o,t){
 const crit=[];
 t.p.forEach(p=>{const val=o.results[p.k];if(!val)return;
  if(p.opts&&!p.nl.includes(val))crit.push(nm(p)+': '+val);
  if(!p.opts&&p.crit){const n=parseFloat(val);if(!isNaN(n)&&(n<p.crit.lo||n>p.crit.hi))crit.push(nm(p)+': '+val)}});
 return crit;
}

 });
}

function slotsFor(docId,date){
 const doc=doctorOf(docId);if(!doc||!doc.schedule)return[];
 const dow=['sun','mon','tue','wed','thu','fri','sat'][new Date(date).getDay()];
 const s=doc.schedule[dow];if(!s)return[];
 const slots=[];const [sh,sm]=s[0].split(':').map(Number);const [eh,em]=s[1].split(':').map(Number);
 const step=+(S.settings?.slotMinutes||30);
 for(let t=sh*60+sm;t<eh*60+em;t+=step){
  const hh=String(Math.floor(t/60)).padStart(2,'0');const mm=String(t%60).padStart(2,'0');
  slots.push(hh+':'+mm);
 }
 return slots;
}

 ps.forEach(s=>{(s.method==='cash'?cash+=s.total:s.method==='card'?card+=s.total:0);byDept.pharmacy=(byDept.pharmacy||0)+s.total});

 return{vs,ps,byDept,byStaff,cash,card,total,comm,net:total-comm,count:vs.length+ps.length};
}

  U.modal=null;save();render();toast(x('أُضيف','Added'))},
 rxadd:a=>{U.rxForm={medId:S.meds[0]?.id,dose:'',freq:'',duration:'',notes:'',doctorId:U.session?.linkedDoctor||''};U.modal={t:'rxmodal',vid:a.dataset.vid};render()},
 rxadditem:()=>{const d=U.rxForm;const v=S.visits.find(v=>v.id===U.modal.vid);v.prescriptions=v.prescriptions||[];v.prescriptions.push({...d});save();U.rxForm={medId:S.meds[0]?.id,dose:'',freq:'',duration:'',notes:'',doctorId:d.doctorId};render()},
 rxdone:()=>{U.modal=null;save();render();toast(x('تم','Done'))},
 rxdel:a=>{const v=S.visits.find(v=>v.id===a.dataset.vid);v.prescriptions.splice(+a.dataset.i,1);save();render()},
 rxview:a=>{U.modal={t:'rxview',vid:a.dataset.vid};render()},
 vitaladd:a=>{const pid=a?.dataset?.pid||U.patientFile||U.currentPatient;U.vitalsForm={bp:'',pulse:'',temp:'',spo2:'',weight:''};U.modal={t:'vitalmodal',pid};render()},
 vitalsave:()=>{const d=U.vitalsForm;const p=patOf(U.modal.pid);p.vitals=p.vitals||[];p.vitals.push({...d,time:Date.now()});U.modal=null;save();render();toast(x('حُفظ','Saved'))},
 openmed:a=>{U.currentPatient=a.dataset.id;U.view='patientfile';U.patientFile=a.dataset.id;render()},
 allergyadd:()=>{const pid=U.patientFile||U.currentPatient;U.allergyForm={substance:'',reaction:'',severity:'mild'};U.modal={t:'allergymodal',pid};render()},
 allergysave:()=>{const d=U.allergyForm;const p=patOf(U.modal.pid);p.allergies=p.allergies||[];p.allergies.push({...d});U.modal=null;save();render();toast(x('أُضيفت','Added'))},
 allergydel:a=>{const p=patOf(U.patientFile);p.allergies.splice(+a.dataset.i,1);save();render()},
 historyadd:()=>{const pid=U.patientFile||U.currentPatient;U.histForm={condition:'',since:'',note:''};U.modal={t:'histmodal',pid};render()},
 histsave:()=>{const d=U.histForm;const p=patOf(U.modal.pid);p.history=p.history||[];p.history.push({...d});U.modal=null;save();render()},
 historydel:a=>{const p=patOf(U.patientFile);p.history.splice(+a.dataset.i,1);save();render()},
 admnew:()=>{U.admForm={pid:S.patients[0]?.id,bedId:S.beds.find(b=>b.status==='free')?.id,doctorId:S.doctors[0]?.id,diagnosis:'',notes:''};U.modal={t:'admmodal'};render()},
 admsave:()=>{const d=U.admForm;if(!d.pid||!d.bedId)return toast(x('اختر','Pick'));const bed=bedOf(d.bedId);if(bed.status!=='free')return toast(x('مشغول','Occupied'));
  S.admNo=(S.admNo||0)+1;S.admissions.push({id:'ad'+uid(),no:S.admNo,...d,time:Date.now(),status:'active',total:0});bed.status='occupied';U.modal=null;save();render();toast(x('تم','Done'))},
 admdischarge:a=>{const ad=S.admissions.find(x=>x.id===a.dataset.id);if(!confirm(x('خروج؟','Discharge?')))return;ad.status='discharged';ad.dischargeTime=Date.now();bedOf(ad.bedId).status='free';save();render();toast(x('تم الخروج','Discharged'))},
 radnew:()=>{U.radForm={pid:S.patients[0]?.id,testId:S.radiologyCatalog[0]?.id,notes:''};U.modal={t:'radmodal'};render()},
 radsave:()=>{const d=U.radForm;if(!d.pid||!d.testId)return toast('Fill');S.radOrders.push({id:uid(),pid:d.pid,testId:d.testId,status:'pending',time:Date.now(),report:'',notes:d.notes});U.modal=null;save();render();toast(x('تم','Done'))},
 radreport:a=>{U.radReportText='';U.modal={t:'radreport',id:a.dataset.id};render()},
 radsaveRep:a=>{const o=S.radOrders.find(o=>o.id===a.dataset.id);o.report=U.radReportText||'';o.status='done';o.doneAt=Date.now();U.radReportText='';U.modal=null;save();render();toast(x('حُفظ','Saved'))},
 radview:a=>{U.modal={t:'radview',id:a.dataset.id};render()},
 insnew:()=>{U.modal={t:'insmodal',mode:'add',data:{ar:'',en:'',discount:70,coPay:30,active:true}};render()},
 insedit:a=>{const i=insurerOf(a.dataset.id);U.modal={t:'insmodal',mode:'edit',id:i.id,data:{...i}};render()},
 inssave:()=>{const d=U.modal.data;if(!d.ar||!d.en)return toast('Fill');
  if(U.modal.mode==='add'){S.insurers.push({id:'ins'+uid(),...d,discount:+d.discount||0,coPay:+d.coPay||0})}
  else{const i=insurerOf(U.modal.id);Object.assign(i,d,{discount:+d.discount||0,coPay:+d.coPay||0})}
  U.modal=null;save();render();toast(x('حُفظ','Saved'))},
 trfnew:()=>{U.transferForm={medId:S.meds[0]?.id,from:'loc1',to:'loc2',qty:''};U.modal={t:'trfmodal'};render()},
 trfsave:()=>{const d=U.transferForm;const q=+d.qty||0;if(!q)return toast('Qty');if(stockAt(d.medId,d.from)<q)return toast(x('غير متاح','Not enough'));
  S.stockLevels[d.medId][d.from]-=q;S.stockLevels[d.medId][d.to]=(S.stockLevels[d.medId][d.to]||0)+q;
  S.trfNo=(S.trfNo||0)+1;S.transfers.push({id:uid(),no:S.trfNo,medId:d.medId,from:d.from,to:d.to,qty:q,time:Date.now()});
  U.modal=null;save();render();toast(x('تم','Done'))},
 exportvisits:()=>{const rows=[['No','Patient','Date','Total','Method','Shift'],...S.visits.map(v=>[v.no,patOf(v.pid).name,new Date(v.time).toISOString(),v.total,v.method,v.shift])];exportCSV(rows,'visits.csv');toast('Exported')},
 exportsales:()=>{const rows=[['No','Items','Total','Method','Date'],...S.sales.map(s=>[s.no,s.lines.map(l=>nm(medOf(l.medId)||{})+' x'+l.qty).join('; '),s.total,s.method,new Date(s.time).toISOString()])];exportCSV(rows,'sales.csv');toast('Exported')},
 exportpatients:()=>{const rows=[['ID','Name','Phone','Age','Insurer'],...S.patients.map(p=>[p.id,p.name,p.phone,p.age,p.insurer?nm(insurerOf(p.insurer)):''])];exportCSV(rows,'patients.csv');toast('Exported')},
 exportall:()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shifa-hospital-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);addAudit('backup.export','تم تصدير نسخة احتياطية','Backup exported');save();render();toast(x('تم حفظ النسخة الاحتياطية','Backup saved'))},
 importall:(btn,e)=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!d.users)throw 0;S=d;save();render();addAudit('backup.import','تم استيراد نسخة احتياطية','Backup imported');save();render();toast(x('تم استيراد النسخة الاحتياطية','Backup imported'))}catch(err){toast(x('ملف غير صالح','Invalid file'))}};r.readAsText(f)}
};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=A[a.dataset.act];if(f)f(a,e)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.inp;if(!k)return;
 if(k==='res'){const o=S.orders.find(o=>o.id===U.labSel);o.results[t.dataset.k]=t.value;save();render();return}
 if(k.startsWith('np.'))U.np[k.slice(3)]=t.value;
 else if(k.startsWith('pd.'))U.pur.d[k.slice(3)]=t.value;
 else if(k==='retSearch')U.retSearch=t.value;
 else U[k]=t.value;
 render()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.usr){U.modal.data[t.dataset.usr]=t.type==='checkbox'?t.checked:t.value;if(t.dataset.usr==='role')render();return}
 if(t.dataset.med){const v=['price','cost','stock','min'].includes(t.dataset.med)?+t.value:t.value;U.modal.data[t.dataset.med]=v;return}
 if(t.dataset.pat){U.modal.data[t.dataset.pat]=t.dataset.pat==='age'?+t.value:t.value;if(t.dataset.pat==='insurer')render();return}
 if(t.dataset.appt){U.modal.data[t.dataset.appt]=t.value;if(t.dataset.appt==='doctorId'||t.dataset.appt==='date'){const slots=slotsFor(U.modal.data.doctorId,U.modal.data.date);const booked=bookedSlots(U.modal.data.doctorId,U.modal.data.date);U.modal.data.time=slots.find(s=>!booked.includes(s))||''}render();return}
 if(t.dataset.diag){U.diagForm[t.dataset.diag]=t.value;return}
 if(t.dataset.rx){U.rxForm[t.dataset.rx]=t.value;if(t.dataset.rx==='medId')render();return}
 if(t.dataset.vit){U.vitalsForm[t.dataset.vit]=t.value;return}
 if(t.dataset.alg){U.allergyForm[t.dataset.alg]=t.value;return}
 if(t.dataset.hst){U.histForm[t.dataset.hst]=t.value;return}
 if(t.dataset.adm){U.admForm[t.dataset.adm]=t.value;return}
 if(t.dataset.rad){U.radForm[t.dataset.rad]=t.value;return}
 if(t.dataset.ins){U.modal.data[t.dataset.ins]=t.type==='checkbox'?t.checked:t.value;return}
 if(t.dataset.trf){U.transferForm[t.dataset.trf]=t.value;return}
 const k=t.dataset.chg;if(!k)return;
 if(k==='res'){S.orders.find(o=>o.id===U.labSel).results[t.dataset.k]=t.value}
 else if(k==='roster'){S.roster[t.dataset.d]=t.value}
 else if(k==='svcp')svcOf(t.dataset.id).price=Math.max(0,+t.value||0);
 else if(k==='svcc')svcOf(t.dataset.id).pct=Math.min(100,Math.max(0,+t.value||0));
 else if(k==='testp')S.tests.find(x=>x.id===t.dataset.id).price=Math.max(0,+t.value||0);
 else if(k==='radp')radOf(t.dataset.id).price=Math.max(0,+t.value||0);
 else if(k==='perm'){const l=S.perms[t.dataset.r];const i=l.indexOf(t.dataset.k);if(t.checked&&i<0)l.push(t.dataset.k);if(!t.checked&&i>=0)l.splice(i,1)}
 else if(k==='hn')S.hospital[t.dataset.l]=t.value||S.hospital[t.dataset.l];
 else if(k==='cur')S.cur=t.value;
 else if(k==='settings'){S.settings=S.settings||{};S.settings[t.dataset.k]=['slotMinutes','maxAdvanceDays','vat'].includes(t.dataset.k)?+t.value:t.value}
 else if(k==='psup')U.pur.sup=t.value;
 else if(k==='pd.med')U.pur.d.med=t.value;
 else if(k==='apptDoctor')U.apptDoctor=t.value||null;
 save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.modal){U.modal=null;render()}if(e.key==='Enter'&&!U.session&&U.loginUser&&U.loginPass){doLogin()}});

try{window.BC=new BroadcastChannel('shifa-hospital');window.BC.onmessage=()=>{};}catch(e){}
S=load();if(!S)seed();
render();
</script>
</body></html>
